[package]
name = "collection-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust vs TS benchmark of the collection filter / sort / group hot paths"

# Standalone: not a member of the repo's cargo workspace.
[workspace]

[dependencies]
rayon = "1"
regex = "1"
rustc-hash = "2"
memchr = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

[profile.release]
lto = "thin"
codegen-units = 1
