[package]
name = "panoptic-db"
version = "0.1.0"
edition = "2024"
description = "SQLite layer of Panoptic: panoptic.db / project.db / data.db / media.db (byte-compatible with the Python backend)"

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
# preserve_order: JSON objects keep their insertion order, like Python dicts, so values written by
# Rust (tab state, plugin data, change sets) round-trip with the same key order as Python's.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
